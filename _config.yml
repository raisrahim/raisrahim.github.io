title: Muhammad Rais Rahim
author: Muhammad Rais Rahim
email: rais.gowa@gmail.com
url: "https://raisrahim.com"
#github_username: raisrahim
#linkedin_username: raisrahim
baseurl: "" # the site is served from the domain root
description: >-
  Muhammad Rais Rahim is a software architect and engineering leader with 15+ years
  of experience designing distributed systems, cloud architectures, and enterprise software.

permalink: /:slug.html

favicon: "logo.svg" # name+extension of favicon (which must be put on the root folder)
# goat_counter: "yoursitename" # put your GoatCounter name if you want to use GoatCounter analytics

remote_theme: riggraz/no-style-please # if you are using GitHub Pages, change it to remote_theme: riggraz/no-style-please

theme_config:
  appearance: "auto" # can be "light", "dark" or "auto"
  back_home_text: ".." # customize back-link text
  date_format: "%Y-%m-%d" # customize how date is formatted
  show_description: false # show blog description in home page
  lowercase_titles: true # show titles in lowercase in lists

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jektex

jektex:
  cache_dir: ".jektex-cache"
  ignore: ["*.xml"]
  silent: false
  macros:
    - ["\\Q", "\\mathbb{Q}"]
    - ["\\C", "\\mathbb{C}"]

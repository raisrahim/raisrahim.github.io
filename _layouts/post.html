---
layout: default
---

<article>
  <header class="post-header">
    {%- include back_link.html url="/writing/" text="← Writing" -%}

    <h1 class="post-title">{{ page.title }}</h1>

    <p class="post-meta">
      <time datetime="{{ page.date }}">{{ page.date | date: site.theme_config.date_format }}</time>
    </p>
  </header>

  {{ content }}
</article>

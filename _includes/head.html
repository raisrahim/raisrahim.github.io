<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>
    {%- if page.title -%}
      {{ page.title }}
    {%- else -%}
      {{ site.title }}
    {%- endif -%}
  </title>

  {%- assign seo_title = page.title | default: site.title -%}
  {%- assign seo_description = page.description | default: site.description | strip_html | normalize_whitespace -%}
  <meta name="description" content="{{ seo_description | escape }}" />
  <meta name="author" content="{{ site.author | escape }}" />
  <meta property="og:title" content="{{ seo_title | escape }}" />
  <meta property="og:description" content="{{ seo_description | escape }}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:site_name" content="{{ site.title | escape }}" />
  <meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="{{ seo_title | escape }}" />
  <meta name="twitter:description" content="{{ seo_description | escape }}" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"{% if page.date %}BlogPosting{% else %}WebPage{% endif %}","headline":{{ seo_title | jsonify }},"description":{{ seo_description | jsonify }},"url":{{ page.url | absolute_url | jsonify }},"author":{"@type":"Person","name":{{ site.author | jsonify }}}}
  </script>
  {%-feed_meta-%}

  <link rel="icon" type="image/svg+xml" href="{{ site.favicon | relative_url }}" />
  <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.css" integrity="sha384-OH8qNTHoMMVNVcKdKewlipV4SErXqccxxlg6HC9Cwjr5oZu2AdBej1TndeCirael" crossorigin="anonymous">

</head>
